openapi: 3.1.0
info:
  title: StockFlow Orders API
  version: 0.1.0
paths:
  /api/cart/items:
    post:
      summary: Add product to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Cart item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '422':
          description: Invalid cart item payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Checkout rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/draft:
    post:
      summary: Create draft order from cart with price snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Draft order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid draft order payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Checkout rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/checkout/options:
    get:
      summary: Get checkout payment and delivery options
      responses:
        '200':
          description: Checkout options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOptionsResponse'
  /api/orders/{id}/checkout:
    get:
      summary: Get checkout state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Checkout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
    put:
      summary: Configure address, payment and shipments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureCheckoutRequest'
      responses:
        '200':
          description: Checkout configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '409':
          description: Invalid shipment distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid checkout payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/confirm:
    post:
      summary: Request draft order confirmation and async inventory reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order confirmation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order confirmation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Checkout rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/paid:
    post:
      summary: Mark confirmed order paid and deduct reserved stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order paid or already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order payment conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cancelled:
    post:
      summary: Cancel order and release reserved stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order cancelled or already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order cancellation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/expired:
    post:
      summary: Expire order and release reserved stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order expired or already expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order expiration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    CartResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Cart'
    OrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Order'
    CheckoutOptionsResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CheckoutOptions'
    CheckoutResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - order
            - options
          properties:
            order:
              $ref: '#/components/schemas/CheckoutOrder'
            options:
              $ref: '#/components/schemas/CheckoutOptions'
    AddCartItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        cart_id:
          type:
            - integer
            - 'null'
        product_id:
          type: integer
        quantity:
          type: integer
    CreateDraftOrderRequest:
      type: object
      required:
        - cart_id
      properties:
        cart_id:
          type: integer
        city_code:
          type: string
        promo_code:
          type: string
        product_ids:
          type: array
          items:
            type: integer
    ConfigureCheckoutRequest:
      type: object
      required:
        - payment_method
        - address
        - shipments
      properties:
        payment_method:
          type: string
        address:
          $ref: '#/components/schemas/CheckoutAddress'
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutShipment'
    CheckoutOptions:
      type: object
      required:
        - payment_methods
        - delivery_services
      properties:
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOption'
        delivery_services:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOption'
    CheckoutOption:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
    CheckoutOrder:
      type: object
      required:
        - id
        - status
        - payment_method
        - checkout_at
        - address
        - total_amount_minor
        - currency
        - items
        - shipments
      properties:
        id:
          type: integer
        status:
          type: string
        payment_method:
          type:
            - string
            - 'null'
        checkout_at:
          type:
            - string
            - 'null'
          format: date-time
        address:
          $ref: '#/components/schemas/CheckoutAddress'
        total_amount_minor:
          type: integer
        currency:
          type:
            - string
            - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutOrderItem'
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutShipment'
    CheckoutAddress:
      type: object
      required:
        - recipient_name
        - recipient_phone
        - country_code
        - city
        - postal_code
        - address_line_1
        - address_line_2
      properties:
        recipient_name:
          type:
            - string
            - 'null'
        recipient_phone:
          type:
            - string
            - 'null'
        country_code:
          type:
            - string
            - 'null'
        city:
          type:
            - string
            - 'null'
        postal_code:
          type:
            - string
            - 'null'
        address_line_1:
          type:
            - string
            - 'null'
        address_line_2:
          type:
            - string
            - 'null'
    CheckoutShipment:
      type: object
      required:
        - delivery_service
        - items
      properties:
        id:
          type: integer
        delivery_service:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutShipmentItem'
    CheckoutShipmentItem:
      type: object
      required:
        - order_item_id
        - quantity
      properties:
        order_item_id:
          type: integer
        quantity:
          type: integer
    CheckoutOrderItem:
      type: object
      required:
        - id
        - product_id
        - sku
        - product_name
        - quantity
        - unit_amount_minor
        - line_amount_minor
        - currency
      properties:
        id:
          type: integer
        product_id:
          type: integer
        sku:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
        unit_amount_minor:
          type: integer
        line_amount_minor:
          type: integer
        currency:
          type: string
    Cart:
      type: object
      required:
        - id
        - items
      properties:
        id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      required:
        - product_id
        - sku
        - product_name
        - quantity
      properties:
        product_id:
          type: integer
        sku:
          type:
            - string
            - 'null'
        product_name:
          type:
            - string
            - 'null'
        quantity:
          type: integer
    Order:
      type: object
      required:
        - id
        - cart_id
        - status
        - city_code
        - promo_code
        - subtotal_amount_minor
        - discount_amount_minor
        - total_amount_minor
        - currency
        - confirmed_at
        - paid_at
        - cancelled_at
        - expired_at
        - items
      properties:
        id:
          type: integer
        cart_id:
          type:
            - integer
            - 'null'
        status:
          type: string
          enum:
            - draft
            - reservation_pending
            - confirmed
            - reservation_failed
            - paid
            - cancelled
            - expired
        city_code:
          type:
            - string
            - 'null'
        promo_code:
          type:
            - string
            - 'null'
        subtotal_amount_minor:
          type: integer
        discount_amount_minor:
          type: integer
        total_amount_minor:
          type: integer
        currency:
          type:
            - string
            - 'null'
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        paid_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        expired_at:
          type:
            - string
            - 'null'
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required:
        - product_id
        - sku
        - product_name
        - quantity
        - pricing_product_price_id
        - price_type
        - price_city_code
        - price_version
        - price_active_from
        - unit_amount_minor
        - currency
        - line_amount_minor
      properties:
        product_id:
          type: integer
        sku:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
        pricing_product_price_id:
          type:
            - integer
            - 'null'
        price_type:
          type: string
        price_city_code:
          type:
            - string
            - 'null'
        price_version:
          type: integer
        price_active_from:
          type:
            - string
            - 'null'
          format: date-time
        unit_amount_minor:
          type: integer
        currency:
          type: string
        line_amount_minor:
          type: integer
