openapi: 3.1.0
info:
  title: StockFlow Inventory API
  version: 0.1.0
paths:
  /api/inventory/stock:
    get:
      summary: Get aggregated stock by SKU or product id
      parameters:
        - name: sku
          in: query
          required: false
          schema:
            type: string
        - name: product_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: city_code
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Stock found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
        '404':
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid stock query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/stock-movements:
    get:
      summary: List recent stock movements with cursor pagination
      parameters:
        - name: stock_item_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - received
              - reserved
              - released
              - expired
              - deducted
              - returned
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Stock movements page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementPage'
        '422':
          description: Invalid movement query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/reservations:
    post:
      summary: Reserve stock with idempotency and TTL
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '409':
          description: Reservation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid reservation payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/reservations/cancel:
    post:
      summary: Cancel active stock reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
      responses:
        '200':
          description: Reservation canceled or already inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '422':
          description: Invalid cancel payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    StockResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Stock'
    ReservationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Reservation'
    StockMovementPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    CursorPaginationMeta:
      type: object
      required:
        - next_cursor
        - per_page
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        per_page:
          type: integer
    StockMovement:
      type: object
      required:
        - id
        - stock_item_id
        - reservation_id
        - type
        - quantity
        - reference_type
        - reference_id
        - metadata
        - occurred_at
      properties:
        id:
          type: integer
        stock_item_id:
          type: integer
        reservation_id:
          type:
            - integer
            - 'null'
        type:
          type: string
          enum:
            - received
            - reserved
            - released
            - expired
            - deducted
            - returned
        quantity:
          type: integer
        reference_type:
          type:
            - string
            - 'null'
        reference_id:
          type:
            - string
            - 'null'
        metadata:
          type:
            - object
            - 'null'
        occurred_at:
          type: string
          format: date-time
    CreateReservationRequest:
      type: object
      required:
        - quantity
        - reservation_expires_at
      properties:
        stock_item_id:
          type: integer
          minimum: 1
        warehouse_id:
          type: integer
          minimum: 1
        product_id:
          type: integer
          minimum: 1
        sku:
          type: string
        city_code:
          type: string
        routing_strategy:
          type: string
          enum:
            - nearest_warehouse
            - fallback
            - split_shipment
        quantity:
          type: integer
          minimum: 1
        reservation_expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
    CancelReservationRequest:
      type: object
      required:
        - idempotency_key
      properties:
        idempotency_key:
          type: string
    Reservation:
      type: object
      required:
        - id
        - stock_item_id
        - warehouse_id
        - warehouse_code
        - city_code
        - idempotency_key
        - quantity
        - status
        - reservation_expires_at
        - canceled_at
      properties:
        id:
          type: integer
        stock_item_id:
          type: integer
        warehouse_id:
          type:
            - integer
            - 'null'
        warehouse_code:
          type:
            - string
            - 'null'
        city_code:
          type:
            - string
            - 'null'
        idempotency_key:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum:
            - active
            - canceled
            - expired
            - consumed
        reservation_expires_at:
          type: string
          format: date-time
        canceled_at:
          type:
            - string
            - 'null'
          format: date-time
        routing_strategy:
          type: string
          enum:
            - nearest_warehouse
            - fallback
            - split_shipment
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/ReservationShipment'
    ReservationShipment:
      type: object
      required:
        - id
        - stock_item_id
        - warehouse_id
        - warehouse_code
        - city_code
        - idempotency_key
        - quantity
        - status
        - reservation_expires_at
        - canceled_at
      properties:
        id:
          type: integer
        stock_item_id:
          type: integer
        warehouse_id:
          type:
            - integer
            - 'null'
        warehouse_code:
          type:
            - string
            - 'null'
        city_code:
          type:
            - string
            - 'null'
        idempotency_key:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum:
            - active
            - canceled
            - expired
            - consumed
        reservation_expires_at:
          type: string
          format: date-time
        canceled_at:
          type:
            - string
            - 'null'
          format: date-time
    Stock:
      type: object
      required:
        - sku
        - product_id
        - on_hand_quantity
        - reserved_quantity
        - available_quantity
        - warehouses
      properties:
        sku:
          type: string
        product_id:
          type: integer
        on_hand_quantity:
          type: integer
        reserved_quantity:
          type: integer
        available_quantity:
          type: integer
        warehouses:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseStock'
    WarehouseStock:
      type: object
      required:
        - warehouse_id
        - warehouse_code
        - warehouse_name
        - city_code
        - city_name
        - on_hand_quantity
        - reserved_quantity
        - available_quantity
      properties:
        warehouse_id:
          type: integer
        warehouse_code:
          type:
            - string
            - 'null'
        warehouse_name:
          type:
            - string
            - 'null'
        city_code:
          type:
            - string
            - 'null'
        city_name:
          type:
            - string
            - 'null'
        on_hand_quantity:
          type: integer
        reserved_quantity:
          type: integer
        available_quantity:
          type: integer
