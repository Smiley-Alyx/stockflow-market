openapi: 3.1.0
info:
  title: StockFlow Search API
  version: 0.1.0
paths:
  /api/search/products:
    get:
      summary: Search indexed catalog products
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated search result list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProductListResponse'
        '422':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Search rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    SearchProductListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchProduct'
        meta:
          $ref: '#/components/schemas/SearchPaginationMeta'
    SearchPaginationMeta:
      type: object
      required:
        - query
        - current_page
        - per_page
        - total
      properties:
        query:
          type: string
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    SearchProduct:
      type: object
      required:
        - id
        - name
        - slug
        - sku
        - status
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        sku:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          type: string
        category_id:
          type:
            - integer
            - 'null'
        published_at:
          type:
            - string
            - 'null'
          format: date-time
