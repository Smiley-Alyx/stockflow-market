openapi: 3.1.0
info:
  title: StockFlow Pricing API
  version: 0.1.0
paths:
  /api/pricing/prices:
    get:
      summary: Calculate active prices for products
      parameters:
        - name: product_ids
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: integer
              minimum: 1
        - name: price_types
          in: query
          required: false
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              maxLength: 64
        - name: city_code
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Product prices calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListResponse'
        '422':
          description: Invalid pricing query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    PriceListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductPrice'
    ProductPrice:
      type: object
      required:
        - product_id
        - price_type
        - city_code
        - price_version
        - amount_minor
        - currency
        - active_from
      properties:
        product_id:
          type: integer
        price_type:
          type: string
        city_code:
          type:
            - string
            - 'null'
        price_version:
          type: integer
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        active_from:
          type:
            - string
            - 'null'
          format: date-time
