openapi: 3.1.0
info:
  title: StockFlow Gateway API
  version: 0.1.0
paths:
  /api/catalog/products:
    get:
      summary: List catalog products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
  /api/catalog/products/{slug}:
    get:
      summary: Get catalog product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/catalog/categories/tree:
    get:
      summary: Get active catalog category tree
      responses:
        '200':
          description: Active category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTreeResponse'
  /api/search/products:
    get:
      summary: Search indexed catalog products
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated search result list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProductListResponse'
        '422':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/stock:
    get:
      summary: Get aggregated stock by SKU or product id
      parameters:
        - name: sku
          in: query
          required: false
          schema:
            type: string
        - name: product_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Stock found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
        '404':
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid stock query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/pricing/prices:
    get:
      summary: Calculate active prices for products
      parameters:
        - name: product_ids
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: integer
              minimum: 1
      responses:
        '200':
          description: Product prices calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListResponse'
        '422':
          description: Invalid pricing query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cart/items:
    post:
      summary: Add product to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Cart item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '422':
          description: Invalid cart item payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/draft:
    post:
      summary: Create draft order from cart with price snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Draft order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid draft order payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/confirm:
    post:
      summary: Confirm draft order and reserve inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order confirmation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ProductResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    SearchProductListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchProduct'
        meta:
          $ref: '#/components/schemas/SearchPaginationMeta'
    StockResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Stock'
    PriceListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductPrice'
    CartResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Cart'
    OrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Order'
    AddCartItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        cart_id:
          type:
            - integer
            - 'null'
        product_id:
          type: integer
        quantity:
          type: integer
    CreateDraftOrderRequest:
      type: object
      required:
        - cart_id
      properties:
        cart_id:
          type: integer
    PaginationMeta:
      type: object
      required:
        - current_page
        - last_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    SearchPaginationMeta:
      type: object
      required:
        - query
        - current_page
        - per_page
        - total
      properties:
        query:
          type: string
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Stock:
      type: object
      required:
        - sku
        - product_id
        - on_hand_quantity
        - reserved_quantity
        - available_quantity
        - warehouses
      properties:
        sku:
          type: string
        product_id:
          type: integer
        on_hand_quantity:
          type: integer
        reserved_quantity:
          type: integer
        available_quantity:
          type: integer
        warehouses:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseStock'
    WarehouseStock:
      type: object
      required:
        - warehouse_id
        - warehouse_code
        - on_hand_quantity
        - reserved_quantity
        - available_quantity
      properties:
        warehouse_id:
          type: integer
        warehouse_code:
          type:
            - string
            - 'null'
        on_hand_quantity:
          type: integer
        reserved_quantity:
          type: integer
        available_quantity:
          type: integer
    ProductPrice:
      type: object
      required:
        - product_id
        - amount_minor
        - currency
      properties:
        product_id:
          type: integer
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Cart:
      type: object
      required:
        - id
        - items
      properties:
        id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      required:
        - product_id
        - sku
        - product_name
        - quantity
      properties:
        product_id:
          type: integer
        sku:
          type:
            - string
            - 'null'
        product_name:
          type:
            - string
            - 'null'
        quantity:
          type: integer
    Order:
      type: object
      required:
        - id
        - cart_id
        - status
        - total_amount_minor
        - currency
        - confirmed_at
        - items
      properties:
        id:
          type: integer
        cart_id:
          type:
            - integer
            - 'null'
        status:
          type: string
          enum:
            - draft
            - confirmed
            - reservation_failed
        total_amount_minor:
          type: integer
        currency:
          type:
            - string
            - 'null'
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required:
        - product_id
        - sku
        - product_name
        - quantity
        - unit_amount_minor
        - currency
        - line_amount_minor
      properties:
        product_id:
          type: integer
        sku:
          type: string
        product_name:
          type: string
        quantity:
          type: integer
        unit_amount_minor:
          type: integer
        currency:
          type: string
        line_amount_minor:
          type: integer
    Product:
      type: object
      required:
        - id
        - name
        - slug
        - sku
        - status
        - availability
        - category
        - attributes
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        sku:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - draft
            - published
            - archived
        availability:
          $ref: '#/components/schemas/ProductAvailability'
        published_at:
          type:
            - string
            - 'null'
          format: date-time
        category:
          $ref: '#/components/schemas/ProductCategory'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
    ProductAvailability:
      type: object
      required:
        - in_stock
        - available_quantity
      properties:
        in_stock:
          type: boolean
        available_quantity:
          type: integer
          minimum: 0
    ProductCategory:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    ProductAttribute:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
    SearchProduct:
      type: object
      required:
        - id
        - name
        - slug
        - sku
        - status
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        sku:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          type: string
        category_id:
          type:
            - integer
            - 'null'
        published_at:
          type:
            - string
            - 'null'
          format: date-time
    CategoryTreeResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryNode:
      type: object
      required:
        - id
        - name
        - slug
        - children
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type:
            - string
            - 'null'
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
