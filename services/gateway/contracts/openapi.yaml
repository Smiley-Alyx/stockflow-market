openapi: 3.1.0
info:
  title: StockFlow Gateway API
  version: 0.1.0
paths:
  /api/catalog/products:
    get:
      summary: List catalog products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: category_path
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: brands
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: filters
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
        - name: in_stock
          in: query
          required: false
          schema:
            type: boolean
        - name: city_code
          in: query
          required: false
          schema:
            type: string
        - name: price_from
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: price_to
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - newest
              - price_asc
              - price_desc
              - rating_asc
              - rating_desc
            default: newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 12
              - 16
              - 20
              - 24
            default: 20
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '429':
          description: Catalog rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid catalog filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog/{path}:
    get:
      summary: List products by catalog and filter URL
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '422':
          description: Invalid catalog URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog/{category_path}/{product_slug}:
    get:
      summary: Get catalog product card by category path and product slug
      parameters:
        - name: category_path
          in: path
          required: true
          schema:
            type: string
        - name: product_slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product card found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/catalog/products/{slug}:
    get:
      summary: Get catalog product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/catalog/categories/tree:
    get:
      summary: Get active catalog category tree
      responses:
        '200':
          description: Active category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTreeResponse'
  /api/homepage:
    get:
      summary: Get ordered active homepage blocks
      responses:
        '200':
          description: Homepage blocks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageResponse'
  /api/search/products:
    get:
      summary: Search indexed catalog products
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated search result list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProductListResponse'
        '422':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Search rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/stock:
    get:
      summary: Get aggregated stock by SKU or product id
      parameters:
        - name: sku
          in: query
          required: false
          schema:
            type: string
        - name: product_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: city_code
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Stock found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockResponse'
        '404':
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid stock query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/stock-movements:
    get:
      summary: List recent stock movements with cursor pagination
      parameters:
        - name: stock_item_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - received
              - reserved
              - released
              - expired
              - deducted
              - returned
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Stock movements page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementPage'
        '422':
          description: Invalid movement query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/reservations:
    post:
      summary: Reserve stock with idempotency and TTL
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '409':
          description: Reservation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Stock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid reservation payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/inventory/reservations/cancel:
    post:
      summary: Cancel active stock reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
      responses:
        '200':
          description: Reservation canceled or already inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '422':
          description: Invalid cancel payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/pricing/prices:
    get:
      summary: Calculate active prices for products
      parameters:
        - name: product_ids
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: integer
              minimum: 1
        - name: price_types
          in: query
          required: false
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              maxLength: 64
        - name: city_code
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Product prices calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListResponse'
        '422':
          description: Invalid pricing query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cart/items:
    post:
      summary: Add product to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Cart item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '422':
          description: Invalid cart item payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Checkout rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/draft:
    post:
      summary: Create draft order from cart with price snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftOrderRequest'
      responses:
        '201':
          description: Draft order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Draft order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid draft order payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Checkout rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/confirm:
    post:
      summary: Request draft order confirmation and async inventory reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order confirmation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order confirmation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Checkout rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/paid:
    post:
      summary: Mark confirmed order paid and deduct reserved stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order paid or already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order payment conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/cancelled:
    post:
      summary: Cancel order and release reserved stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order cancelled or already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order cancellation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/orders/{id}/expired:
    post:
      summary: Expire order and release reserved stock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order expired or already expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Order expiration conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    HomepageResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HomepageBlock'
    HomepageBlock:
      type: object
      required:
        - id
        - type
        - title
        - position
        - content
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - recommended_products
            - bestseller_products
            - new_products
            - description
            - cities
            - banner
        title:
          type:
            - string
            - 'null'
        position:
          type: integer
        content:
          type: object
    ProductResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    SearchProductListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SearchProduct'
        meta:
          $ref: '#/components/schemas/SearchPaginationMeta'
    StockResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Stock'
    ReservationResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Reservation'
    StockMovementPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
    CursorPaginationMeta:
      type: object
      required:
        - next_cursor
        - per_page
      properties:
        next_cursor:
          type:
            - string
            - 'null'
        per_page:
          type: integer
    StockMovement:
      type: object
      required:
        - id
        - stock_item_id
        - reservation_id
        - type
        - quantity
        - reference_type
        - reference_id
        - metadata
        - occurred_at
      properties:
        id:
          type: integer
        stock_item_id:
          type: integer
        reservation_id:
          type:
            - integer
            - 'null'
        type:
          type: string
          enum:
            - received
            - reserved
            - released
            - expired
            - deducted
            - returned
        quantity:
          type: integer
        reference_type:
          type:
            - string
            - 'null'
        reference_id:
          type:
            - string
            - 'null'
        metadata:
          type:
            - object
            - 'null'
        occurred_at:
          type: string
          format: date-time
    PriceListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductPrice'
    CartResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Cart'
    OrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Order'
    AddCartItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        cart_id:
          type:
            - integer
            - 'null'
        product_id:
          type: integer
        quantity:
          type: integer
    CreateDraftOrderRequest:
      type: object
      required:
        - cart_id
      properties:
        cart_id:
          type: integer
        city_code:
          type: string
        promo_code:
          type: string
        product_ids:
          type: array
          items:
            type: integer
    CreateReservationRequest:
      type: object
      required:
        - quantity
        - reservation_expires_at
      properties:
        stock_item_id:
          type: integer
          minimum: 1
        warehouse_id:
          type: integer
          minimum: 1
        product_id:
          type: integer
          minimum: 1
        sku:
          type: string
        city_code:
          type: string
        routing_strategy:
          type: string
          enum:
            - nearest_warehouse
            - fallback
            - split_shipment
        quantity:
          type: integer
          minimum: 1
        reservation_expires_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
    CancelReservationRequest:
      type: object
      required:
        - idempotency_key
      properties:
        idempotency_key:
          type: string
    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        category_path:
          type:
            - string
            - 'null'
        canonical_url:
          type: string
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreadcrumb'
        filter_url:
          type: string
        price_range:
          $ref: '#/components/schemas/CatalogPriceRange'
    SearchPaginationMeta:
      type: object
      required:
        - query
        - current_page
        - per_page
        - total
      properties:
        query:
          type: string
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Stock:
      type: object
      required:
        - sku
        - product_id
        - on_hand_quantity
        - reserved_quantity
        - available_quantity
        - warehouses
      properties:
        sku:
          type: string
        product_id:
          type: integer
        on_hand_quantity:
          type: integer
        reserved_quantity:
          type: integer
        available_quantity:
          type: integer
        warehouses:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseStock'
    WarehouseStock:
      type: object
      required:
        - warehouse_id
        - warehouse_code
        - warehouse_name
        - city_code
        - city_name
        - on_hand_quantity
        - reserved_quantity
        - available_quantity
      properties:
        warehouse_id:
          type: integer
        warehouse_code:
          type:
            - string
            - 'null'
        warehouse_name:
          type:
            - string
            - 'null'
        city_code:
          type:
            - string
            - 'null'
        city_name:
          type:
            - string
            - 'null'
        on_hand_quantity:
          type: integer
        reserved_quantity:
          type: integer
        available_quantity:
          type: integer
    Reservation:
      type: object
      required:
        - id
        - stock_item_id
        - warehouse_id
        - warehouse_code
        - city_code
        - idempotency_key
        - quantity
        - status
        - reservation_expires_at
        - canceled_at
      properties:
        id:
          type: integer
        stock_item_id:
          type: integer
        warehouse_id:
          type:
            - integer
            - 'null'
        warehouse_code:
          type:
            - string
            - 'null'
        city_code:
          type:
            - string
            - 'null'
        idempotency_key:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum:
            - active
            - canceled
            - expired
            - consumed
        reservation_expires_at:
          type: string
          format: date-time
        canceled_at:
          type:
            - string
            - 'null'
          format: date-time
        routing_strategy:
          type: string
          enum:
            - nearest_warehouse
            - fallback
            - split_shipment
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/ReservationShipment'
    ReservationShipment:
      type: object
      required:
        - id
        - stock_item_id
        - warehouse_id
        - warehouse_code
        - city_code
        - idempotency_key
        - quantity
        - status
        - reservation_expires_at
        - canceled_at
      properties:
        id:
          type: integer
        stock_item_id:
          type: integer
        warehouse_id:
          type:
            - integer
            - 'null'
        warehouse_code:
          type:
            - string
            - 'null'
        city_code:
          type:
            - string
            - 'null'
        idempotency_key:
          type: string
        quantity:
          type: integer
        status:
          type: string
          enum:
            - active
            - canceled
            - expired
            - consumed
        reservation_expires_at:
          type: string
          format: date-time
        canceled_at:
          type:
            - string
            - 'null'
          format: date-time
    ProductPrice:
      type: object
      required:
        - product_id
        - price_type
        - city_code
        - price_version
        - amount_minor
        - currency
        - active_from
      properties:
        product_id:
          type: integer
        price_type:
          type: string
        city_code:
          type:
            - string
            - 'null'
        price_version:
          type: integer
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
        active_from:
          type:
            - string
            - 'null'
          format: date-time
    Cart:
      type: object
      required:
        - id
        - items
      properties:
        id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      required:
        - product_id
        - sku
        - product_name
        - quantity
      properties:
        product_id:
          type: integer
        sku:
          type:
            - string
            - 'null'
        product_name:
          type:
            - string
            - 'null'
        quantity:
          type: integer
    Order:
      type: object
      required:
        - id
        - cart_id
        - status
        - city_code
        - promo_code
        - subtotal_amount_minor
        - discount_amount_minor
        - total_amount_minor
        - currency
        - confirmed_at
        - paid_at
        - cancelled_at
        - expired_at
        - items
      properties:
        id:
          type: integer
        cart_id:
          type:
            - integer
            - 'null'
        status:
          type: string
          enum:
            - draft
            - reservation_pending
            - confirmed
            - reservation_failed
            - paid
            - cancelled
            - expired
        city_code:
          type:
            - string
            - 'null'
        promo_code:
          type:
            - string
            - 'null'
        subtotal_amount_minor:
          type: integer
        discount_amount_minor:
          type: integer
        total_amount_minor:
          type: integer
        currency:
          type:
            - string
            - 'null'
        confirmed_at:
          type:
            - string
            - 'null'
          format: date-time
        paid_at:
          type:
            - string
            - 'null'
          format: date-time
        cancelled_at:
          type:
            - string
            - 'null'
          format: date-time
        expired_at:
          type:
            - string
            - 'null'
          format: date-time
        items:
          type: array
          items:
