openapi: 3.1.0
info:
  title: StockFlow Gateway API
  version: 0.1.0
paths:
  /api/catalog/products:
    get:
      summary: List catalog products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
  /api/catalog/products/{slug}:
    get:
      summary: Get catalog product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/catalog/categories/tree:
    get:
      summary: Get active catalog category tree
      responses:
        '200':
          description: Active category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTreeResponse'
  /api/search/products:
    get:
      summary: Search indexed catalog products
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated search result list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProductListResponse'
        '422':
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ProductResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    SearchProductListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/SearchPaginationMeta'
    PaginationMeta:
      type: object
      required:
        - current_page
        - last_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    SearchPaginationMeta:
      type: object
      required:
        - query
        - current_page
        - per_page
        - total
      properties:
        query:
          type: string
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    Product:
      type: object
      required:
        - id
        - name
        - slug
        - sku
        - status
        - category
        - attributes
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        sku:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - draft
            - published
            - archived
        published_at:
          type:
            - string
            - 'null'
          format: date-time
        category:
          $ref: '#/components/schemas/ProductCategory'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
    ProductCategory:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    ProductAttribute:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
    CategoryTreeResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryNode:
      type: object
      required:
        - id
        - name
        - slug
        - children
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type:
            - string
            - 'null'
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
