openapi: 3.1.0
info:
  title: StockFlow Catalog API
  version: 0.1.0
paths:
  /api/catalog/products:
    get:
      summary: List catalog products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: category_path
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: brands
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: filters
          in: query
          required: false
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
        - name: in_stock
          in: query
          required: false
          schema:
            type: boolean
        - name: city_code
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - newest
              - price_asc
              - price_desc
              - rating_asc
              - rating_desc
            default: newest
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 12
              - 16
              - 20
              - 24
            default: 20
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '429':
          description: Catalog rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid catalog filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/catalog/products/{slug}:
    get:
      summary: Get catalog product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/catalog/categories/tree:
    get:
      summary: Get active catalog category tree
      responses:
        '200':
          description: Active category tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTreeResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ProductResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      required:
        - current_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        category_path:
          type:
            - string
            - 'null'
        canonical_url:
          type: string
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreadcrumb'
    Product:
      type: object
      required:
        - id
        - name
        - slug
        - sku
        - status
        - availability
        - category
        - attributes
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        sku:
          type: string
        description:
          type:
            - string
            - 'null'
        short_description:
          type:
            - string
            - 'null'
        image_url:
          type:
            - string
            - 'null'
        rating:
          type: number
        rating_count:
          type: integer
        status:
          type: string
          enum:
            - draft
            - published
            - archived
        availability:
          $ref: '#/components/schemas/ProductAvailability'
        price:
          oneOf:
            - $ref: '#/components/schemas/CatalogPrice'
            - type: 'null'
        published_at:
          type:
            - string
            - 'null'
          format: date-time
        category:
          $ref: '#/components/schemas/ProductCategory'
        brand:
          oneOf:
            - $ref: '#/components/schemas/ProductBrand'
            - type: 'null'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/ProductOffer'
    ProductAvailability:
      type: object
      required:
        - in_stock
        - available_quantity
      properties:
        in_stock:
          type: boolean
        available_quantity:
          type: integer
          minimum: 0
        city_code:
          type:
            - string
            - 'null'
    CatalogPrice:
      type: object
      required:
        - amount_minor
        - original_amount_minor
        - discount_amount_minor
        - discount_percent
        - currency
        - city_code
      properties:
        amount_minor:
          type: integer
        original_amount_minor:
          type: integer
        discount_amount_minor:
          type: integer
        discount_percent:
          type: integer
        currency:
          type: string
        city_code:
          type:
            - string
            - 'null'
    ProductCategory:
      type: object
      required:
        - id
        - name
        - slug
        - path
        - url
        - breadcrumbs
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        path:
          type: string
        url:
          type: string
        breadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreadcrumb'
    CategoryBreadcrumb:
      type: object
      required:
        - id
        - name
        - slug
        - url
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        url:
          type: string
    ProductAttribute:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
        value:
          type: string
    ProductBrand:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    ProductOffer:
      type: object
      required:
        - id
        - name
        - sku
        - status
        - image_url
        - attributes
      properties:
        id:
          type: integer
        name:
          type:
            - string
            - 'null'
        sku:
          type: string
        status:
          type: string
        image_url:
          type:
            - string
            - 'null'
        attributes:
          type: object
    CategoryTreeResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    CategoryNode:
      type: object
      required:
        - id
        - name
        - slug
        - filterable_attributes
        - url
        - children
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type:
            - string
            - 'null'
        filterable_attributes:
          type: array
          items:
            type: string
        url:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
