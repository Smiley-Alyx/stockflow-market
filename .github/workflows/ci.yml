name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Composer test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, pdo_sqlite, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: composer test

  pint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, pdo_sqlite, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

  event-contracts:
    name: Domain event compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check backward compatibility
        run: php scripts/check-event-contract-compatibility.php "${{ github.event.pull_request.base.sha }}"

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config --quiet

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  promtool:
    name: Prometheus config and alert rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/docker/prometheus/rules:/etc/prometheus/rules:ro" \
            prom/prometheus:v3.8.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Test Prometheus alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/docker/prometheus/rules:/etc/prometheus/rules:ro" \
            -w /etc/prometheus/rules \
            prom/prometheus:v3.8.0 \
            test rules stockflow-alerts.test.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm \
            --entrypoint amtool \
            -v "$PWD/docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml

  broker-e2e:
    name: Broker checkout E2E
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: stockflow-market

    steps:
      - name: Checkout marketplace
        uses: actions/checkout@v4
        with:
          path: stockflow-market

      - name: Checkout ERP sandbox
        uses: actions/checkout@v4
        with:
          repository: Smiley-Alyx/stockflow-erp-mock
          path: stockflow-erp-mock

      - name: Checkout payment sandbox
        uses: actions/checkout@v4
        with:
          repository: Smiley-Alyx/stockflow-payment-mock
          path: stockflow-payment-mock

      - name: Checkout delivery sandbox
        uses: actions/checkout@v4
        with:
          repository: Smiley-Alyx/stockflow-delivery-mock
          path: stockflow-delivery-mock

      - name: Reset broker E2E stack
        run: docker compose -f docker-compose-all.yml down --volumes --remove-orphans

      - name: Run broker checkout E2E
        env:
          KEEP_BROKER_E2E_STACK: 'true'
          TIMEOUT_SECONDS: '60'
        run: ./scripts/test-broker-checkout-e2e.sh

      - name: Collect broker E2E logs
        if: failure()
        run: |
          docker compose -f docker-compose-all.yml ps --all > broker-e2e.log || true
          docker compose -f docker-compose-all.yml logs --no-color >> broker-e2e.log 2>&1 || true

      - name: Upload broker E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-e2e-logs
          path: stockflow-market/broker-e2e.log
          if-no-files-found: ignore

      - name: Stop broker E2E stack
        if: always()
        run: docker compose -f docker-compose-all.yml down --volumes --remove-orphans

  alert-drills:
    name: Alert delivery failure drills
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run alert delivery failure drills
        env:
          KEEP_ALERT_DRILL_STACK: 'true'
          TIMEOUT_SECONDS: '300'
        run: ./scripts/test-alert-drills.sh

      - name: Collect alert drill logs
        if: failure()
        run: |
          docker compose -f docker-compose-all.yml ps --all > alert-drills.log || true
          docker compose -f docker-compose-all.yml logs --no-color >> alert-drills.log 2>&1 || true

      - name: Upload alert drill logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alert-drill-logs
          path: alert-drills.log
          if-no-files-found: ignore

      - name: Stop alert drill stack
        if: always()
        run: docker compose -f docker-compose-all.yml down --volumes --remove-orphans
