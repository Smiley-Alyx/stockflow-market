global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: stockflow-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - php:8000

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets:
          - rabbitmq:15692
