services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: backup_drill
      POSTGRES_PASSWORD: backup_drill
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup_drill -d stockflow"]
      interval: 2s
      timeout: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: backup_drill
      RABBITMQ_DEFAULT_PASS: backup_drill
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.11-alpine
    environment:
      CLICKHOUSE_DB: stockflow
      CLICKHOUSE_USER: backup_drill
      CLICKHOUSE_PASSWORD: backup_drill
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user backup_drill --password backup_drill --query 'SELECT 1' || exit 1"
        ]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
    name: stockflow-backup-drill-postgres-data
  rabbitmq-data:
    name: stockflow-backup-drill-rabbitmq-data
  clickhouse-data:
    name: stockflow-backup-drill-clickhouse-data
