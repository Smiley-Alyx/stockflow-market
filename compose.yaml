services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stockflow-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    ports:
      - "8080:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: stockflow
      DB_USERNAME: stockflow
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-false}
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      AI_ASSISTANT_PROVIDER: ${AI_ASSISTANT_PROVIDER:-openai}
      GIGACHAT_ASSISTANT_DRIVER: ${GIGACHAT_ASSISTANT_DRIVER:-}
      YANDEX_ASSISTANT_DRIVER: ${YANDEX_ASSISTANT_DRIVER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_ENABLED: ${CLICKHOUSE_ENABLED:-false}
      CLICKHOUSE_DATABASE: stockflow
      CLICKHOUSE_USERNAME: stockflow
      CLICKHOUSE_PASSWORD: secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stockflow-queue-worker
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: stockflow
      DB_USERNAME: stockflow
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_DATABASE: stockflow
      CLICKHOUSE_USERNAME: stockflow
      CLICKHOUSE_PASSWORD: secret
      CLICKHOUSE_ENABLED: ${CLICKHOUSE_ENABLED:-false}
    depends_on:
      php:
        condition: service_started
      redis:
        condition: service_healthy
    command: php artisan queue:work redis --queue=default --sleep=1 --tries=5 --timeout=15

  search-index-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stockflow-search-index-worker
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: stockflow
      DB_USERNAME: stockflow
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_DATABASE: stockflow
      CLICKHOUSE_USERNAME: stockflow
      CLICKHOUSE_PASSWORD: secret
      CLICKHOUSE_ENABLED: ${CLICKHOUSE_ENABLED:-false}
      STOCKFLOW_SEARCH_INDEX_QUEUE: search-indexing
    depends_on:
      php:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: php artisan queue:work redis --queue=search-indexing --sleep=1 --tries=5 --timeout=15

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stockflow-scheduler
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: stockflow
      DB_USERNAME: stockflow
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      ELASTICSEARCH_HOST: http://elasticsearch:9200
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_DATABASE: stockflow
      CLICKHOUSE_USERNAME: stockflow
      CLICKHOUSE_PASSWORD: secret
      CLICKHOUSE_ENABLED: ${CLICKHOUSE_ENABLED:-false}
    depends_on:
      php:
        condition: service_started
      redis:
        condition: service_healthy
    command: php artisan schedule:work

  frontend:
    image: node:24-alpine
    container_name: stockflow-frontend
    working_dir: /var/www/html/frontend
    volumes:
      - .:/var/www/html
      - npm-cache:/root/.npm
    ports:
      - "3000:3000"
    environment:
      NUXT_API_BASE: http://php:8000
      NUXT_PUBLIC_API_BASE: http://localhost:8080
    command: sh -c "npm install && npm run dev"
    depends_on:
      - php

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.31.0
    container_name: stockflow-swagger-ui
    ports:
      - "8084:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./services/gateway/contracts/openapi.yaml:/openapi.yaml:ro

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: stockflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      php:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:12.3.0
    container_name: stockflow-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: stockflow
      GF_SECURITY_ADMIN_PASSWORD: stockflow
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  postgres:
    image: postgres:18-alpine
    container_name: stockflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: stockflow-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: stockflow-rabbitmq
    profiles: ["extended"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: stockflow
      RABBITMQ_DEFAULT_PASS: secret
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
    container_name: stockflow-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.11-alpine
    container_name: stockflow-clickhouse
    profiles: ["extended"]
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: stockflow
      CLICKHOUSE_USER: stockflow
      CLICKHOUSE_PASSWORD: secret
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user stockflow --password secret --query 'SELECT 1' || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  composer-cache:
  npm-cache:
  postgres-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
